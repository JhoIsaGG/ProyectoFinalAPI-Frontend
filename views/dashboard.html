<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja de Tickets - Mesa de Ayuda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        
        <!-- Content Area -->
        <div class="app-content">
            <!-- Navbar -->
            <div id="navbar-container"></div>
            
            <!-- Main Content -->
            <main class="main-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Bandeja de Tickets</h1>
                        <p class="page-subtitle">Visualiza y gestiona las solicitudes de soporte técnico</p>
                    </div>
                    <a href="./ticket-crear.html" class="btn btn-primary">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                        Crear Ticket
                    </a>
                </div>

                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-info">
                            <h3>Total Activos</h3>
                            <p id="stat-total">0</p>
                        </div>
                        <div class="stat-icon stat-icon-blue">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <h3>En Proceso</h3>
                            <p id="stat-process">0</p>
                        </div>
                        <div class="stat-icon stat-icon-orange">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-info">
                            <h3>Resueltos</h3>
                            <p id="stat-resolved">0</p>
                        </div>
                        <div class="stat-icon stat-icon-green">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card" style="padding: 16px; margin-bottom: 20px;">
                    <div class="filters-bar">
                        <div class="filter-item-search">
                            <label for="filter-search" class="form-label">Buscar por ID o Título</label>
                            <input type="text" id="filter-search" class="form-control" placeholder="Buscar...">
                        </div>
                        <div class="filter-item">
                            <label for="filter-categoria" class="form-label">Categoría</label>
                            <select id="filter-categoria" class="form-control">
                                <option value="">Todas</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label for="filter-prioridad" class="form-label">Prioridad</label>
                            <select id="filter-prioridad" class="form-control">
                                <option value="">Todas</option>
                            </select>
                        </div>
                        <div class="filter-item">
                            <label for="filter-estado" class="form-label">Estado</label>
                            <select id="filter-estado" class="form-control">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div>
                            <button id="btn-clear-filters" class="btn btn-secondary" style="height: 42px;">
                                Limpiar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table class="table" id="tickets-table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Título</th>
                                <th>Categoría</th>
                                <th>Prioridad</th>
                                <th>Estado</th>
                                <th>Asignado A</th>
                                <th>Creado El</th>
                                <th style="width: 120px; text-align: center;">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tickets-list">
                            <tr>
                                <td colspan="8" class="text-center" style="padding: 30px; color: var(--text-light);">
                                    Cargando tickets...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Injectable Components -->
    <script type="module" src="../js/presentation/components/navbar.js"></script>
    <script type="module" src="../js/presentation/components/sidebar.js"></script>
    <!-- Page Controller -->
    <script type="module" src="../js/presentation/controllers/dashboard-controller.js"></script>
</body>
</html>
