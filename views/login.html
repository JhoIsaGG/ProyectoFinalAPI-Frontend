<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mesa de Ayuda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h1 class="login-title">Mesa de Ayuda</h1>
            <p class="login-subtitle">Ingresa tus credenciales para acceder a la plataforma</p>
            
            <div id="alert-error" class="badge badge-danger w-full text-center" style="display: none; padding: 12px; margin-bottom: 20px; font-weight: 500;">
                Credenciales incorrectas o servidor no disponible.
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="ejemplo@empresa.com" required value="admin@empresa.com">
                </div>
                
                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required value="1234">
                </div>
                
                <button type="submit" class="btn btn-primary w-full" style="padding: 12px;">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <script type="module" src="../js/presentation/controllers/login-controller.js"></script>
</body>
</html>
