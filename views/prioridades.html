<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prioridades de Ticket - Mesa de Ayuda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        
        <!-- Content Area -->
        <div class="app-content">
            <!-- Navbar -->
            <div id="navbar-container"></div>
            
            <!-- Main Content -->
            <main class="main-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Gestión de Prioridades de Ticket</h1>
                        <p class="page-subtitle">Administra las prioridades de tickets (Baja, Media, Alta, etc.) y su orden</p>
                    </div>
                    <button id="btn-nuevo-catalogo" class="btn btn-primary">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 18px; height: 18px;"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                        Nueva Prioridad
                    </button>
                </div>

                <div id="alert-error-global" class="badge badge-danger w-full text-center" style="display: none; padding: 12px; margin-bottom: 20px; font-weight: 500;"></div>

                <!-- Catalog Table -->
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Orden numérico</th>
                                <th>Nombre de la Prioridad</th>
                                <th>Estado</th>
                                <th style="width: 160px; text-align: center;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="catalogo-list">
                            <tr>
                                <td colspan="5" class="text-center" style="padding: 30px; color: var(--text-light);">
                                    Cargando prioridades...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="catalogo-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title" class="modal-title">Nueva Prioridad</h3>
                <button id="modal-close" class="modal-close">&times;</button>
            </div>
            <form id="catalogo-form">
                <input type="hidden" id="item-id">
                <div class="modal-body">
                    <div id="alert-error-modal" class="badge badge-danger w-full text-center" style="display: none; padding: 10px; margin-bottom: 15px;"></div>

                    <div class="form-group">
                        <label for="nombre" class="form-label">Nombre de la Prioridad</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej. Alta" required>
                        <div id="error-nombre" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="orden" class="form-label">Orden de Severidad / Importancia</label>
                        <input type="number" id="orden" class="form-control" placeholder="Ej. 3" min="1" required>
                        <span style="font-size: 0.75rem; color: var(--text-light);">* Cuanto mayor sea el número, mayor es la prioridad.</span>
                        <div id="error-orden" class="form-error"></div>
                    </div>

                    <div class="form-group">
                        <label for="estado" class="form-label">Estado</label>
                        <select id="estado" class="form-control">
                            <option value="1">Activo</option>
                            <option value="0">Inactivo</option>
                        </select>
                        <div id="error-estado" class="form-error"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="modal-cancel" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Prioridad</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Injectable Components -->
    <script type="module" src="../js/presentation/components/navbar.js"></script>
    <script type="module" src="../js/presentation/components/sidebar.js"></script>
    <!-- Page Controller -->
    <script type="module" src="../js/presentation/controllers/prioridad-controller.js"></script>
</body>
</html>
