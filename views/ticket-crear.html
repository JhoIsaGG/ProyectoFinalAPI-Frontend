<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ticket - Mesa de Ayuda</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <div id="sidebar-container"></div>
        
        <!-- Content Area -->
        <div class="app-content">
            <!-- Navbar -->
            <div id="navbar-container"></div>
            
            <!-- Main Content -->
            <main class="main-content">
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Nuevo Ticket</h1>
                        <p class="page-subtitle">Registra una nueva solicitud de soporte</p>
                    </div>
                    <a href="./dashboard.html" class="btn btn-secondary">
                        Volver a la bandeja
                    </a>
                </div>

                <div class="card" style="max-width: 800px; margin: 0 auto;">
                    <div id="alert-error" class="badge badge-danger w-full text-center" style="display: none; padding: 12px; margin-bottom: 20px; font-weight: 500;">
                        Ocurrió un error.
                    </div>
                    <div id="alert-success" class="badge badge-success w-full text-center" style="display: none; padding: 12px; margin-bottom: 20px; font-weight: 500;">
                        Ticket creado correctamente. Redirigiendo...
                    </div>

                    <form id="create-ticket-form">
                        <div class="form-group">
                            <label for="titulo" class="form-label">Título del Ticket</label>
                            <input type="text" id="titulo" class="form-control" placeholder="Escribe un título breve y descriptivo" required>
                            <div id="error-titulo" class="form-error"></div>
                        </div>

                        <div class="form-group">
                            <label for="descripcion" class="form-label">Descripción Detallada</label>
                            <textarea id="descripcion" class="form-control" rows="6" placeholder="Describe detalladamente el problema o solicitud" required></textarea>
                            <div id="error-descripcion" class="form-error"></div>
                        </div>

                        <div class="filters-bar" style="margin-bottom: 0; align-items: stretch;">
                            <div class="filter-item">
                                <label for="categoria" class="form-label">Categoría</label>
                                <select id="categoria" class="form-control" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                </select>
                                <div id="error-categoria" class="form-error"></div>
                            </div>

                            <div class="filter-item">
                                <label for="prioridad" class="form-label">Prioridad</label>
                                <select id="prioridad" class="form-control" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                </select>
                                <div id="error-prioridad" class="form-error"></div>
                            </div>

                            <div class="filter-item">
                                <label for="estado" class="form-label">Estado Inicial</label>
                                <select id="estado" class="form-control" required>
                                    <!-- Se poblará de la API, pero el primero será por defecto -->
                                </select>
                                <div id="error-estado" class="form-error"></div>
                            </div>
                        </div>

                        <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px;">
                            <a href="./dashboard.html" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary">
                                Guardar Ticket
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Injectable Components -->
    <script type="module" src="../js/presentation/components/navbar.js"></script>
    <script type="module" src="../js/presentation/components/sidebar.js"></script>
    <!-- Page Controller -->
    <script type="module" src="../js/presentation/controllers/ticket-create-controller.js"></script>
</body>
</html>
